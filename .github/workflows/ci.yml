name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permiso explícito para que el GITHUB_TOKEN automático de esta ejecución
# pueda publicar paquetes (imágenes) en GHCR. Por defecto viene en solo lectura.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # se resuelve a "juan-in-one/web"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Trivy — escaneo de configuración (Dockerfile + chart de Helm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          exit-code: "0" # informativo por ahora, igual que en car-api/sport-api

      - name: Volcar hallazgos de configuración al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — configuración (Dockerfile + chart)"
            echo '```'
            cat trivy-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: oxlint — análisis estático del código TypeScript/React
        # Equivalente a Semgrep en las APIs Python: linter propio del
        # proyecto, ya configurado en .oxlintrc.json.
        run: npm run lint -- --format=github > oxlint.txt || true

      - name: Volcar hallazgos de oxlint al resumen del job
        if: always()
        run: |
          {
            echo "## 🔎 oxlint — análisis estático del código"
            echo '```'
            cat oxlint.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticarse en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy — escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          output: trivy-image.txt
          exit-code: "0"

      - name: Volcar hallazgos de la imagen al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — vulnerabilidades de la imagen"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Arrancar el contenedor para el DAST
        # web no tiene base de datos: basta con levantar la imagen ya
        # construida, igual que se serviría en el clúster.
        run: docker run -d --name web-dast -p 8080:8080 ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

      - name: Esperar a que responda
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done

      - name: OWASP ZAP — DAST (baseline scan)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080/"
          cmd_options: "-a"
          fail_action: false
          allow_issue_writing: false

      - name: Volcar hallazgos de ZAP al resumen del job
        if: always()
        run: |
          {
            echo "## 🕷️ OWASP ZAP — DAST (baseline)"
            if [ -f report_md.md ]; then cat report_md.md; else echo "(sin informe generado)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
