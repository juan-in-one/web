name: CI

on:
  # Solo al fusionar a main — la CD de verdad (build, escaneos, firma,
  # SBOM, publicar, DAST). Lo que hay que validar antes de fusionar vive en
  # pr-checks.yml (pull_request), que nunca puede publicar nada.
  push:
    branches: [main]

# Permiso explícito para que el GITHUB_TOKEN automático de esta ejecución
# pueda publicar paquetes (imágenes) en GHCR. Por defecto viene en solo lectura.
permissions:
  contents: read
  packages: write
  id-token: write # necesario para la firma keyless de Cosign

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # se resuelve a "juan-in-one/web"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SYFT_VERSION: "1.51.1"
  SYFT_SHA256_LINUX_AMD64: "8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3"
  COSIGN_VERSION: "v3.1.3"

jobs:
  secrets-scan:
    # Igual que en car-api/sport-api/academy-api (workflow compartido
    # juan-in-one/.github): Gitleaks sobre todo el historial de git, con el
    # binario oficial (MIT) en vez de la Action empaquetada, que exige
    # licencia de pago en repos privados.
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo (con historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks (versión fija, checksum verificado)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Gitleaks — detección de secretos en todo el historial
        run: gitleaks detect --source . --redact -v

  build-and-push:
    needs: [secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Trivy — escaneo de configuración (Dockerfile + chart de Helm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Volcar hallazgos de configuración al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — configuración (Dockerfile + chart)"
            echo '```'
            cat trivy-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: oxlint — análisis estático del código TypeScript/React
        # Sin "|| true": un aviso de oxlint bloquea, igual que Ruff en las
        # APIs Python — es barato de arreglar, no aplica la misma cautela
        # que con CVEs de terceros.
        run: npm run lint -- --format=github > oxlint.txt

      - name: Volcar hallazgos de oxlint al resumen del job
        if: always()
        run: |
          {
            echo "## 🔎 oxlint — análisis estático del código"
            echo '```'
            cat oxlint.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calcular etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Construir la imagen (sin publicar todavía)
        # push:false a propósito, igual que en el workflow compartido de las
        # APIs: se escanea la imagen ANTES de publicarla, no después.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trivy — escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          output: trivy-image.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Volcar hallazgos de la imagen al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — vulnerabilidades de la imagen"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Autenticarse en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar la imagen (solo si los escaneos anteriores han pasado)
        if: github.event_name == 'push'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Obtener el digest real ya publicado en el registro
        if: github.event_name == 'push'
        id: digest
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          digest=$(docker buildx imagetools inspect "$tag" | awk '/^Digest:/ {print $2; exit}')
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Instalar Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Instalar Syft (SBOM), versión fija y checksum verificado
        if: github.event_name == 'push'
        run: |
          curl -sSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256_LINUX_AMD64}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          sudo mv syft /usr/local/bin/syft

      - name: Cosign — firmar la imagen (keyless, vía OIDC de GitHub Actions)
        if: github.event_name == 'push'
        run: cosign sign --yes "${{ steps.digest.outputs.image_ref }}"

      - name: Syft — generar el SBOM de la imagen
        if: github.event_name == 'push'
        run: |
          tag=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          syft "docker:${tag}" -o cyclonedx-json=sbom.json

      - name: Cosign — adjuntar el SBOM como attestation firmada
        if: github.event_name == 'push'
        run: cosign attest --yes --predicate sbom.json --type cyclonedx "${{ steps.digest.outputs.image_ref }}"

      - name: Arrancar el contenedor para el DAST
        # web no tiene base de datos: basta con levantar la imagen ya
        # construida, igual que se serviría en el clúster.
        run: docker run -d --name web-dast -p 8080:8080 ${{ fromJSON(steps.meta.outputs.json).tags[0] }}

      - name: Esperar a que responda
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/ && break
            sleep 1
          done

      - name: OWASP ZAP — DAST (baseline scan)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8080/"
          # -I: solo bloquea por un FAIL real, no por los 11 WARN de
          # cabeceras de seguridad recomendadas (CSP, Permissions-Policy...)
          # — comprobado en local: hoy 0 FAIL / 11 WARN.
          cmd_options: "-a -I"
          fail_action: true
          allow_issue_writing: false

      - name: Volcar hallazgos de ZAP al resumen del job
        if: always()
        run: |
          {
            echo "## 🕷️ OWASP ZAP — DAST (baseline)"
            if [ -f report_md.md ]; then cat report_md.md; else echo "(sin informe generado)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
