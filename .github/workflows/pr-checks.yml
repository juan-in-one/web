name: PR checks

# Todo lo que tiene sentido validar ANTES de fusionar. Deliberadamente
# separado de ci.yml, que ahora dispara solo con push a main (la CD de
# verdad: publicar, firmar, SBOM, DAST). Aquí no hay ni login a GHCR ni
# paso de publicar en ningún sitio del archivo.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: La rama de origen debe seguir la convención feat/*
        run: |
          if [[ "${{ github.head_ref }}" != feat/* ]]; then
            echo "::error::La rama '${{ github.head_ref }}' no sigue la convención feat/* — renómbrala antes de fusionar."
            exit 1
          fi
          echo "OK: '${{ github.head_ref }}' sigue la convención."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4
      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: oxlint — análisis estático del código TypeScript/React
        run: npm run lint

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo (con historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instalar Gitleaks (versión fija, checksum verificado)
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256_LINUX_X64}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Gitleaks — detección de secretos en todo el historial
        run: gitleaks detect --source . --redact -v

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build-sanity:
    # "¿Esto pasaría los mismos escaneos que la CD real?" — sin login a
    # GHCR, sin Cosign, sin ningún paso capaz de publicar nada.
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Trivy — escaneo de configuración (Dockerfile + chart de Helm)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          output: trivy-config.txt
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Volcar hallazgos de configuración al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — configuración (Dockerfile + chart)"
            echo '```'
            cat trivy-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Calcular una etiqueta de prueba (nunca se publica)
        id: meta
        run: echo "tag=pr-sanity-check:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Construir la imagen (sin publicar — no hay ni login a GHCR en este workflow)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tag }}

      - name: Trivy — escaneo de vulnerabilidades de la imagen
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tag }}
          format: table
          output: trivy-image.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          exit-code: "1"

      - name: Volcar hallazgos de la imagen al resumen del job
        if: always()
        run: |
          {
            echo "## 🛡️ Trivy — vulnerabilidades de la imagen"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repo
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Vitest con cobertura
        run: npm run test:coverage

      - name: Comentar la cobertura en la PR
        uses: davelosert/vitest-coverage-report-action@v2
