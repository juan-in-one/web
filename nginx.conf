# Sustituye la configuración por defecto de la imagen para poder servir una
# SPA con rutas del lado del cliente (React Router: /coche, /retos...).
# Sin el "try_files ... /index.html" de abajo, refrescar la página estando en
# /retos daría un 404 real — nginx buscaría un fichero llamado "retos" que
# no existe, en vez de dejar que React decida qué pintar según la URL.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
